<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>雨垂れ石を穿つ / 鉄杵を磨く</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://accounts.google.com">
<style>
  :root { --bg: #f5f5f5; --card: #fff; --text: #222; --sub: #555; --line: #ccc; --accent: #1a73e8; --onaccent: #fff; --ok: #e6f4ea; --ng: #fce8e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1e1e1e; --text: #e8e8e8; --sub: #aaa; --line: #444; --accent: #8ab4f8; --onaccent: #202124; --ok: #1e3a26; --ng: #4a1f1c; }
  }
  body { font-family: -apple-system, Roboto, "Noto Sans JP", sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h1 small { display: block; font-size: 14px; font-weight: normal; color: var(--sub); margin-top: 2px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; color: var(--sub); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .row2 { display: flex; gap: 8px; } .row2 > div { flex: 1; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 64px; padding: 10px 6px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .seg button.on { background: var(--accent); color: var(--onaccent); border-color: var(--accent); }
  .head { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
  .del { border: none; background: none; color: #d93025; font-size: 14px; padding: 4px 8px; }
  .add { width: 100%; padding: 12px; font-size: 16px; border: 2px dashed var(--accent); color: var(--accent); background: var(--card); border-radius: 12px; margin-bottom: 12px; }
  .submit { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; border: none; border-radius: 12px; background: var(--accent); color: var(--onaccent); }
  .submit:disabled { opacity: .5; }
  .msg { padding: 12px; border-radius: 10px; margin-bottom: 12px; }
  .ok { background: var(--ok); } .ng { background: var(--ng); }
  .hidden { display: none; }
  footer { margin-top: 120px; padding: 16px 0 32px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; color: var(--sub); }
  footer a { color: var(--sub); }
  .stats { font-size: 14px; padding: 10px 14px; }
  .stats .line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 2px 0; }
  .stats .big { font-size: 17px; font-weight: bold; }
  .stats .note { font-size: 12px; color: var(--sub); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>雨垂れ石を穿つ / 鉄杵を磨く<small id="sub"></small></h1>
  <div id="stats" class="card stats hidden"></div>
  <div id="msg"></div>
  <div id="login" class="card hidden">
    <p style="margin:4px 0 12px">記録するには Google でログインしてください。</p>
    <div id="gbtn"></div>
  </div>
  <div id="form" class="hidden">
    <div class="card">
      <label for="date">日付</label><input type="date" id="date">
      <label>時間帯</label><div class="seg" id="slots"></div>
    </div>
    <div id="rows"></div>
    <button class="add" id="add" type="button">＋ 教材を追加</button>
    <div class="card"><label for="memo">メモ（任意）</label><textarea id="memo" rows="2"></textarea></div>
    <button class="submit" id="send" type="button">記録する</button>
  </div>
  <!-- ログイン状態とログアウトは、押し間違えないよう記録ボタンから十分離して最下部に置く -->
  <footer id="who" class="hidden"></footer>
</div>
<script>
(function () {
  // リンクの # 以降に u=（GASのURL）・k=（鍵）・p=（プリセット）を載せる。
  // # 以降はこのページの配信元に送られない。u と k はこの端末に保存し、次回以降は # なしでも開ける
  var STORE = 'asatore-record';
  var CFG_STORE = 'asatore-config';     // 教材の一覧などの控え（秘密ではない）。開いた瞬間に画面を出すために使う
  var TOKEN_STORE = 'asatore-idtoken';  // GoogleのIDトークン。このタブの間だけ（sessionStorage）
  var SESSION_STORE = 'asatore-session'; // GASが発行したログイン済みの印（期限なし）。Googleログインは最初の1回だけで済む
  // 送り先はGASのウェブアプリ（…/exec）だけを認める。細工したリンクで鍵を他所へ送らせないため
  var GAS_URL = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
  var hash = new URLSearchParams(location.hash.slice(1));
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { saved = {}; }
  var api = '', key = '';
  // u と k は必ず同じ出所から組で取る（# に両方あれば #、なければ保存済み）
  if (hash.get('u') && hash.get('k')) {
    if (GAS_URL.test(hash.get('u'))) {
      api = hash.get('u'); key = hash.get('k');
      try { localStorage.setItem(STORE, JSON.stringify({ u: api, k: key })); } catch (e) {}
    }
  } else if (saved.u && saved.k && GAS_URL.test(saved.u)) {
    api = saved.u; key = saved.k;
  }
  var presetName = hash.get('p') || '';

  var $ = function (id) { return document.getElementById(id); };
  var waitingLogin = false;
  var C = null, clientId = '', idToken = '', session = '', slot = '', rows = [], sid = '', dateTouched = false;
  function loadSession() {
    try { var v = JSON.parse(localStorage.getItem(SESSION_STORE) || 'null'); if (v && v.s) { session = v.s; return v; } } catch (e) {}
    return null;
  }
  function saveSession(s, email) { session = s; try { localStorage.setItem(SESSION_STORE, JSON.stringify({ s: s, email: email })); } catch (e) {} }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function newSid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function guessSlot() { var h = new Date().getHours(); if (h < 11) return '朝'; if (h < 14) return '昼'; if (h >= 17) return 'ランニング'; return 'その他'; }
  function isWeekend() { var w = new Date().getDay(); return w === 0 || w === 6; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function msg(t, ok) { $('msg').innerHTML = t ? '<div class="msg ' + (ok ? 'ok' : 'ng') + '">' + esc(t) + '</div>' : ''; if (t) window.scrollTo(0, 0); }

  /* ---------- 設定の控え ---------- */
  function readCache() {
    try { var c = JSON.parse(localStorage.getItem(CFG_STORE) || 'null'); return c && c.u === api && c.config ? c : null; } catch (e) { return null; }
  }
  function writeCache(cfg) { try { localStorage.setItem(CFG_STORE, JSON.stringify({ u: api, config: cfg })); } catch (e) {} }

  /* ---------- Googleログイン ---------- */
  function jwtPayload(t) {
    try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return null; }
  }
  function clearToken() {
    idToken = ''; session = ''; $('who').classList.add('hidden');
    try { sessionStorage.removeItem(TOKEN_STORE); localStorage.removeItem(TOKEN_STORE); localStorage.removeItem(SESSION_STORE); } catch (e) {}
  }
  function showWho(p) {
    $('who').innerHTML = esc(p.email) + ' でログイン中 ・ <a href="#" id="logout">ログアウト</a>';
    $('who').classList.remove('hidden');
    $('logout').onclick = function (ev) {
      ev.preventDefault();
      if (session) call('POST', { action: 'logout', session: session }).catch(function () {});
      clearToken();
      if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
      askLogin(true);
    };
  }
  var gisPromise = null, gisInited = false, pending = [], loginTimer = null, prompted = false;
  function loadGis() {
    if (!gisPromise) gisPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = resolve; s.onerror = function () { gisPromise = null; s.remove(); reject(new Error('Googleログインを読み込めませんでした。電波の良い所でもう一度押してください')); };
      document.head.appendChild(s);
    });
    return gisPromise;
  }
  function onCredential(r) {
    var p = jwtPayload(r.credential);
    if (!p) { msg('ログインに失敗しました。', false); return; }
    idToken = r.credential;
    clearTimeout(loginTimer); $('login').classList.add('hidden');
    // Googleログインを確かめてもらい、期限なしのログイン済みの印を受け取る
    call('POST', { action: 'login' }).then(function (j) {
      saveSession(j.session, j.email); idToken = '';
      showWho({ email: j.email });
      var q = pending; pending = []; q.forEach(function (f) { f(); });
    }).catch(function (err) {
      // どんな失敗でもログインボタンを出し直し、送信待ちを解除する（ボタンが反応しない状態にしない）
      clearToken(); waitingLogin = false;
      msg((err.message || String(err)) + ' もう一度ログインしてください。', false);
      askLogin(true);
    });
  }
  // ログインが済んだら fn を実行する。自動ログインで済めばボタンは出さない（1.5秒たっても済まなければ出す）
  function whenLoggedIn(fn) { if (session) { fn(); return; } pending.push(fn); askLogin(false); }
  // retry=true（許可されていないアカウントだった・ログアウトした）のときは自動選択を止めて、すぐボタンを出す
  function askLogin(retry) {
    if (!clientId) return;
    loadGis().then(function () {
      if (!gisInited) { gisInited = true; google.accounts.id.initialize({ client_id: clientId, auto_select: true, cancel_on_tap_outside: false, callback: onCredential }); }
      $('gbtn').innerHTML = '';
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'ja' });
      clearTimeout(loginTimer);
      if (retry) { google.accounts.id.disableAutoSelect(); $('login').classList.remove('hidden'); return; }
      if (!prompted) { prompted = true; google.accounts.id.prompt(); }
      loginTimer = setTimeout(function () { if (!session && !idToken) $('login').classList.remove('hidden'); }, 1500);
    }).catch(function (err) { msg(err.message, false); });
  }

  /* ---------- 通信（Cookieは送らない。Googleのログイン状態に左右されない） ---------- */
  function call(method, body) {
    var opt = { method: method, credentials: 'omit', redirect: 'follow' };
    var url = api;
    if (method === 'GET') url += '?api=client&k=' + encodeURIComponent(key);
    else {
      body.k = key;
      if (session && body.action !== 'login') body.session = session; else body.idToken = idToken;
      opt.body = JSON.stringify(body); opt.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    }
    return fetch(url, opt).then(function (r) {
      if (!r.ok) throw new Error('通信エラー（' + r.status + '）');
      return r.text();
    }).then(function (t) {
      // GAS側の障害や古いURLのときは、JSONでなくエラー画面のHTMLが返る
      try { return JSON.parse(t); } catch (e) { throw new Error('リンクが古いか、GAS側でエラーが出ています。メールで届いた最新のリンクから開き直してください'); }
    }).then(function (j) {
      if (!j.ok) { var e = new Error(j.error || '失敗しました'); e.code = j.code || ''; throw e; }
      return j;
    });
  }

  /* ---------- 画面 ---------- */
  function preset() { return C && Object.prototype.hasOwnProperty.call(C.presets, presetName) ? C.presets[presetName] : null; }
  function init() {
    $('date').value = today(); dateTouched = false; sid = newSid();
    var p = preset();
    $('sub').textContent = p ? p.label : '';
    slot = (p && p.slot) || guessSlot(); drawSlots();
    var kind = (p && p.kind) || (isWeekend() ? '復習' : '新規');
    rows = [];
    if (p && p.rows.length) p.rows.forEach(function (r) { rows.push({ mat: r[0], min: r[1], keys: '', kind: kind }); });
    else rows.push({ mat: '', min: '', keys: '', kind: kind });
    drawRows(); $('memo').value = '';
  }
  function showForm(cfg) {
    var first = !C; C = cfg;
    renderStats(cfg.stats);
    if (first) { $('form').classList.remove('hidden'); init(); }
    else { sync(); drawSlots(); drawRows(); }  // 入力中の内容は残したまま、教材の一覧だけ新しくする
  }
  function drawSlots() {
    var el = $('slots'); el.innerHTML = '';
    C.slots.forEach(function (s) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = s;
      if (s === slot) b.className = 'on';
      b.onclick = function () { slot = s; drawSlots(); };
      el.appendChild(b);
    });
  }
  function sync() {
    rows.forEach(function (r, i) { r.mat = $('m' + i).value; r.min = $('n' + i).value; r.keys = $('k' + i).value; });
  }
  function drawRows() {
    var el = $('rows'); el.innerHTML = '';
    var mats = C.materials.slice();
    rows.forEach(function (r) { if (r.mat && mats.indexOf(r.mat) < 0) mats.push(r.mat); });
    rows.forEach(function (r, i) {
      var opts = '<option value="">教材を選ぶ</option>' + mats.map(function (m) {
        return '<option value="' + esc(m) + '"' + (m === r.mat ? ' selected' : '') + '>' + esc(m) + '</option>';
      }).join('');
      var c = document.createElement('div'); c.className = 'card';
      c.innerHTML =
        '<div class="head"><span>' + (i + 1) + 'つ目</span>' + (rows.length > 1 ? '<button class="del" type="button" data-i="' + i + '">削除</button>' : '') + '</div>' +
        '<label>教材</label><select id="m' + i + '">' + opts + '</select>' +
        '<div class="row2"><div><label>分</label><input id="n' + i + '" type="number" inputmode="numeric" min="1" max="300" value="' + esc(r.min) + '"></div>' +
        '<div><label>回（例: 12 / 3-5）</label><input id="k' + i + '" value="' + esc(r.keys) + '"></div></div>' +
        '<label>区分</label><div class="seg">' +
        '<button type="button" data-k="新規" data-i="' + i + '"' + (r.kind === '新規' ? ' class="on"' : '') + '>新規</button>' +
        '<button type="button" data-k="復習" data-i="' + i + '"' + (r.kind === '復習' ? ' class="on"' : '') + '>復習</button></div>';
      el.appendChild(c);
    });
    el.querySelectorAll('.del').forEach(function (b) { b.onclick = function () { sync(); rows.splice(+b.dataset.i, 1); drawRows(); }; });
    el.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { sync(); rows[+b.dataset.i].kind = b.dataset.k; drawRows(); }; });
  }

  // ログイン用のクライアントIDを確かめる。控えと違えば（設定タブB15を作り直した等）控えを直し、
  // 古いIDでGoogleログインを始めてしまっていたらページを読み直す
  function checkClientId() {
    return call('GET').then(function (j) {
      if (!j.clientId || j.clientId === clientId) return;
      var started = gisInited;
      clientId = j.clientId;
      if (C) { C.clientId = clientId; writeCache(C); }
      if (started) location.reload();
    });
  }

  /* ---------- 見出しの数字（累計・Lv・連続日数・今週） ---------- */
  function h1f(min) { return (Math.round(min / 6) / 10).toFixed(1); }
  function hm(min) { min = Math.round(min); var h = Math.floor(min / 60); return (h ? h + '時間' : '') + (min % 60 || !h ? (min % 60) + '分' : ''); }
  function bar(r) { return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, Math.round(r * 100))) + '%"></i></div>'; }
  function renderStats(s) {
    if (!s) return;
    var totalH = s.totalMin / 60, lvH = s.lvHours || 50;
    var left = (s.lv + 1) * lvH - totalH;
    var streak = s.streak > 0
      ? '🔥 ' + s.streak + '日連続' + (s.doneToday ? '' : '<span class="note">（今日記録すると' + (s.streak + 1) + '日目）</span>')
      : '<span class="note">今日記録すると連続1日目</span>';
    $('stats').innerHTML =
      '<div class="line"><span class="big">累計 ' + h1f(s.totalMin) + 'h ・ Lv.' + pad(s.lv) + '</span><span class="note">次のLvまで ' + left.toFixed(1) + 'h</span></div>' +
      bar((totalH - s.lv * lvH) / lvH) +
      '<div class="line"><span>' + streak + '</span></div>' +
      '<div class="line" style="margin-top:6px"><span>今週（W' + s.week + '） ' + h1f(s.weekMin) + 'h / ' + h1f(s.weekTarget) + 'h</span>' +
      '<span class="note">' + Math.round(s.weekTarget ? s.weekMin / s.weekTarget * 100 : 0) + '%</span></div>' +
      bar(s.weekTarget ? s.weekMin / s.weekTarget : 0) +
      (s.carryIn > 0 ? '<div class="note" style="margin-top:-4px">目標は前週からの繰越 ' + hm(s.carryIn) + ' を含む</div>' : '');
    $('stats').classList.remove('hidden');
  }

  /* ---------- 設定の取り直し（ログイン後に裏で行う） ---------- */
  function refreshConfig() {
    call('POST', { action: 'config' }).then(function (j) {
      writeCache(j.config);
      if (j.config.clientId) clientId = j.config.clientId;
      if (!C || JSON.stringify(C) !== JSON.stringify(j.config)) showForm(j.config);
      if ($('msg').textContent === '読み込み中…') msg('', true);
    }).catch(function (err) {
      if (err.code === 'AUTH') { clearToken(); msg(err.message, false); pending.push(refreshConfig); checkClientId(); askLogin(true); return; }
      if (!C) msg('読み込めませんでした: ' + (err.message || err), false);
    });
  }

  /* ---------- 送信（押したらすぐ画面を空にし、結果はあとから表示） ---------- */
  var sending = 0;
  function collect() {
    sync();
    var use = rows.filter(function (r) { return r.mat; }).map(function (r) { return { mat: r.mat, min: r.min, keys: r.keys, kind: r.kind }; });
    if (!use.length) { msg('教材を1つ以上選んでください。', false); return null; }
    if (use.some(function (r) { return !(+r.min > 0); })) { msg('分が空欄の教材があります。', false); return null; }
    if (!slot) { msg('時間帯を選んでください。', false); return null; }
    return { sid: sid, date: $('date').value, slot: slot, memo: $('memo').value, rows: use };
  }
  function restore(p) {
    sync();
    if (rows.some(function (r) { return r.mat; })) return false; // 次の入力を始めていたら上書きしない
    rows = p.rows.map(function (r) { return { mat: r.mat, min: r.min, keys: r.keys, kind: r.kind }; });
    $('date').value = p.date; dateTouched = true; slot = p.slot; $('memo').value = p.memo; sid = p.sid;
    drawSlots(); drawRows();
    return true;
  }
  function names(p) { return p.rows.map(function (r) { return r.mat; }).join('・'); }
  function submit(p) {
    if (!session) {
      if (waitingLogin) return;  // ログイン待ちの間の連打は1回にまとめる
      waitingLogin = true; msg('Googleログインのあと送信します…', true);
      whenLoggedIn(function () { waitingLogin = false; var q = collect(); if (q) submit(q); });
      return;
    }
    init();  // すぐ次の入力ができるように空にする
    sending++; msg('送信中…（' + names(p) + '）', true);
    var body = { action: 'record', sid: p.sid, date: p.date, slot: p.slot, memo: p.memo, rows: p.rows };
    call('POST', body).then(function (j) {
      var res = j.result;
      if (res.stats && C) { C.stats = res.stats; writeCache(C); renderStats(res.stats); }
      msg((res.saved < 0 ? 'この内容は記録済みです。' : '記録しました（' + res.saved + '件: ' + names(p) + '）。') + ' W' + res.week + 'の合計: ' + res.weekText, true);
    }).catch(function (err) {
      var back = restore(p);
      if (err.code === 'AUTH') {
        clearToken();
        msg(err.message + (back ? ' ログインし直すと、自動でもう一度送ります。' : '（送れなかった教材: ' + names(p) + '。ログイン後にもう一度入力してください）'), false);
        checkClientId();
        if (back) { waitingLogin = true; pending.push(function () { waitingLogin = false; var q = collect(); if (q) submit(q); }); }
        askLogin(true);
        return;
      }
      msg('記録できませんでした: ' + (err.message || err) + (back ? '（入力を戻しました。もう一度「記録する」を押してください）' : '（送れなかった教材: ' + names(p) + '）'), false);
    }).then(function () { sending--; });
  }

  $('date').onchange = function () { dateTouched = true; };
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !dateTouched && C) $('date').value = today();
  });
  $('add').onclick = function () {
    sync(); var k = rows.length ? rows[rows.length - 1].kind : '新規';
    rows.push({ mat: '', min: '', keys: '', kind: k }); drawRows();
  };
  $('send').onclick = function () { var p = collect(); if (p) submit(p); };
  window.addEventListener('beforeunload', function (e) { if (sending > 0) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------- 起動 ---------- */
  if (!api || !key) { msg('リンクが正しくありません。メールで届いたリンクから開いてください。', false); return; }
  var ses = loadSession();
  if (ses) showWho({ email: ses.email || '' });
  else loadGis();  // ログイン済みの印がない時だけ、Googleログインの読み込みを先に始めておく
  var cache = readCache();
  if (cache) {
    // 前回の控えで、すぐに画面を出す。ログインと最新化は裏で行う
    clientId = cache.config.clientId || '';
    showForm(cache.config);
    if (clientId) whenLoggedIn(refreshConfig);
  }
  if (!cache) msg('読み込み中…', true);
  var hadClientId = !!clientId;
  checkClientId().then(function () {
    if (!hadClientId && clientId) whenLoggedIn(refreshConfig);
  }).catch(function (err) { if (!C || !clientId) msg('読み込めませんでした: ' + (err.message || err), false); });
})();
</script>
</body>
</html>
