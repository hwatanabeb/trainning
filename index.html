<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>朝トレ 記録</title>
<style>
  :root { --bg: #f5f5f5; --card: #fff; --text: #222; --sub: #555; --line: #ccc; --accent: #1a73e8; --ok: #e6f4ea; --ng: #fce8e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --card: #1e1e1e; --text: #e8e8e8; --sub: #aaa; --line: #444; --accent: #8ab4f8; --ok: #1e3a26; --ng: #4a1f1c; }
  }
  body { font-family: -apple-system, Roboto, "Noto Sans JP", sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; color: var(--sub); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .row2 { display: flex; gap: 8px; } .row2 > div { flex: 1; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 64px; padding: 10px 6px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .head { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
  .del { border: none; background: none; color: #d93025; font-size: 14px; padding: 4px 8px; }
  .add { width: 100%; padding: 12px; font-size: 16px; border: 2px dashed var(--accent); color: var(--accent); background: var(--card); border-radius: 12px; margin-bottom: 12px; }
  .submit { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; border: none; border-radius: 12px; background: var(--accent); color: #fff; }
  .submit:disabled { opacity: .5; }
  .msg { padding: 12px; border-radius: 10px; margin-bottom: 12px; }
  .ok { background: var(--ok); } .ng { background: var(--ng); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">朝トレ 記録</h1>
  <div id="msg"></div>
  <div id="form" class="hidden">
    <div class="card">
      <label for="date">日付</label><input type="date" id="date">
      <label>時間帯</label><div class="seg" id="slots"></div>
    </div>
    <div id="rows"></div>
    <button class="add" id="add" type="button">＋ 教材を追加</button>
    <div class="card"><label for="memo">メモ（任意）</label><textarea id="memo" rows="2"></textarea></div>
    <button class="submit" id="send" type="button">記録する</button>
  </div>
</div>
<script>
(function () {
  // リンクの # 以降に u=（GASのURL）・k=（鍵）・p=（プリセット）を載せる。
  // # 以降はこのページの配信元に送られない。u と k はこの端末に保存し、次回以降は # なしでも開ける
  var STORE = 'asatore-record';
  // 送り先はGASのウェブアプリ（…/exec）だけを認める。細工したリンクで鍵を他所へ送らせないため
  var GAS_URL = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
  var hash = new URLSearchParams(location.hash.slice(1));
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { saved = {}; }
  var api = '', key = '';
  // u と k は必ず同じ出所から組で取る（# に両方あれば #、なければ保存済み）
  if (hash.get('u') && hash.get('k')) {
    if (GAS_URL.test(hash.get('u'))) {
      api = hash.get('u'); key = hash.get('k');
      try { localStorage.setItem(STORE, JSON.stringify({ u: api, k: key })); } catch (e) {}
    }
  } else if (saved.u && saved.k && GAS_URL.test(saved.u)) {
    api = saved.u; key = saved.k;
  }
  var presetName = hash.get('p') || '';

  var C = null, slot = '', rows = [], sid = '', dateTouched = false;
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function newSid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function guessSlot() { var d = new Date(), w = d.getDay(), h = d.getHours(); if (w === 0 || w === 6) return '週末'; if (h < 11) return '朝'; if (h >= 17) return 'ランニング'; return 'その他'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function msg(t, ok) { $('msg').innerHTML = '<div class="msg ' + (ok ? 'ok' : 'ng') + '">' + esc(t) + '</div>'; window.scrollTo(0, 0); }

  function preset() { return C && Object.prototype.hasOwnProperty.call(C.presets, presetName) ? C.presets[presetName] : null; }

  function init() {
    $('date').value = today(); dateTouched = false; sid = newSid();
    var p = preset();
    if (p) $('title').textContent = '朝トレ 記録：' + p.label;
    slot = p ? p.slot : guessSlot(); drawSlots();
    var kind = (p && p.kind) || (slot === '週末' ? '復習' : '新規');
    rows = [];
    if (p && p.rows.length) p.rows.forEach(function (r) { rows.push({ mat: r[0], min: r[1], keys: '', kind: kind }); });
    else rows.push({ mat: '', min: '', keys: '', kind: kind });
    drawRows(); $('memo').value = '';
  }

  function drawSlots() {
    var el = $('slots'); el.innerHTML = '';
    C.slots.forEach(function (s) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = s;
      if (s === slot) b.className = 'on';
      b.onclick = function () { slot = s; drawSlots(); };
      el.appendChild(b);
    });
  }

  function sync() {
    rows.forEach(function (r, i) { r.mat = $('m' + i).value; r.min = $('n' + i).value; r.keys = $('k' + i).value; });
  }

  function drawRows() {
    var el = $('rows'); el.innerHTML = '';
    rows.forEach(function (r, i) {
      var opts = '<option value="">教材を選ぶ</option>' + C.materials.map(function (m) {
        return '<option value="' + esc(m) + '"' + (m === r.mat ? ' selected' : '') + '>' + esc(m) + '</option>';
      }).join('');
      var c = document.createElement('div'); c.className = 'card';
      c.innerHTML =
        '<div class="head"><span>' + (i + 1) + 'つ目</span>' + (rows.length > 1 ? '<button class="del" type="button" data-i="' + i + '">削除</button>' : '') + '</div>' +
        '<label>教材</label><select id="m' + i + '">' + opts + '</select>' +
        '<div class="row2"><div><label>分</label><input id="n' + i + '" type="number" inputmode="numeric" min="1" max="300" value="' + esc(r.min) + '"></div>' +
        '<div><label>回（例: 12 / 3-5）</label><input id="k' + i + '" value="' + esc(r.keys) + '"></div></div>' +
        '<label>区分</label><div class="seg">' +
        '<button type="button" data-k="新規" data-i="' + i + '"' + (r.kind === '新規' ? ' class="on"' : '') + '>新規</button>' +
        '<button type="button" data-k="復習" data-i="' + i + '"' + (r.kind === '復習' ? ' class="on"' : '') + '>復習</button></div>';
      el.appendChild(c);
    });
    el.querySelectorAll('.del').forEach(function (b) { b.onclick = function () { sync(); rows.splice(+b.dataset.i, 1); drawRows(); }; });
    el.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { sync(); rows[+b.dataset.i].kind = b.dataset.k; drawRows(); }; });
  }

  // GASのウェブアプリと通信する。Cookieは送らない（Googleのログイン状態に左右されない）
  function call(method, body) {
    var opt = { method: method, credentials: 'omit', redirect: 'follow' };
    var url = api;
    if (method === 'GET') url += (api.indexOf('?') < 0 ? '?' : '&') + 'api=config&k=' + encodeURIComponent(key);
    else { opt.body = JSON.stringify(body); opt.headers = { 'Content-Type': 'text/plain;charset=utf-8' }; }
    return fetch(url, opt).then(function (r) {
      if (!r.ok) throw new Error('通信エラー（' + r.status + '）');
      return r.text();
    }).then(function (t) {
      // GAS側の障害や古いURLのときは、JSONでなくエラー画面のHTMLが返る
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('リンクが古いか、GAS側でエラーが出ています。メールで届いた最新のリンクから開き直してください'); }
      return j;
    }).then(function (j) {
      if (!j.ok) throw new Error(j.error || '失敗しました');
      return j;
    });
  }

  $('date').onchange = function () { dateTouched = true; };
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !dateTouched && C) $('date').value = today();
  });
  $('add').onclick = function () {
    sync(); var k = rows.length ? rows[rows.length - 1].kind : '新規';
    rows.push({ mat: '', min: '', keys: '', kind: k }); drawRows();
  };
  $('send').onclick = function () {
    sync();
    var use = rows.filter(function (r) { return r.mat; });
    if (!use.length) { msg('教材を1つ以上選んでください。', false); return; }
    if (use.some(function (r) { return !(+r.min > 0); })) { msg('分が空欄の教材があります。', false); return; }
    if (!slot) { msg('時間帯を選んでください。', false); return; }
    var btn = this; btn.disabled = true; btn.textContent = '送信中…';
    call('POST', { action: 'record', k: key, sid: sid, date: $('date').value, slot: slot, memo: $('memo').value, rows: use })
      .then(function (j) {
        var res = j.result;
        msg((res.saved < 0 ? 'この内容は記録済みです。' : '記録しました（' + res.saved + '件）。') + ' W' + res.week + 'の合計: ' + res.weekText, true);
        init();
      })
      .catch(function (err) { msg('記録できませんでした: ' + (err.message || err), false); })
      .then(function () { btn.disabled = false; btn.textContent = '記録する'; });
  };

  if (!api || !key) { msg('リンクが正しくありません。メールで届いたリンクから開いてください。', false); return; }
  msg('読み込み中…', true);
  call('GET').then(function (j) {
    C = j.config; $('msg').innerHTML = ''; $('form').classList.remove('hidden'); init();
  }).catch(function (err) { msg('読み込めませんでした: ' + (err.message || err), false); });
})();
</script>
</body>
</html>
